name: Build desktop apps

# Builds the Linux (AppImage, .deb, .tar.gz) and macOS (Apple Silicon + Intel
# .dmg and .zip) versions of the game and publishes them as a GitHub Release.
# Pushing a "v*" tag makes a versioned release; any other push refreshes the
# rolling "latest-build" pre-release.
on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: retroville-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Download the file for your computer:
          - Linux: the .AppImage (any distro), the .deb (Ubuntu/Debian) or the .tar.gz
          - Mac with Apple Silicon (M1 or newer): the -arm64.dmg
          - Mac with an Intel chip: the -x64.dmg

          The Mac app isn't notarized by Apple. The first time, right-click the app and choose Open (see the README).
          Built from ${GITHUB_SHA::7}."
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "Retroville Unleashed $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest-build --cleanup-tag --yes || true
            gh release create latest-build out/* --prerelease --target "$GITHUB_SHA" \
              --title "Retroville Unleashed (latest build)" --notes "$NOTES"
          fi
